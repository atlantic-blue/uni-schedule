name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job assumes a role in Amazon Web Services with OpenID Connect. No static
# key is stored in this repository.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # A build that produced no javascript would upload happily and serve a
      # blank page, so the job refuses an empty bundle.
      - name: Check the build produced something
        run: |
          test -f dist/index.html
          count=$(find dist/assets -name '*.js' | wc -l)
          echo "javascript files: $count"
          test "$count" -ge 1

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Copy the site to Amazon Simple Storage Service
        run: |
          aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --delete \
            --cache-control 'public,max-age=31536000,immutable' \
            --exclude index.html
          aws s3 cp dist/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --cache-control 'no-cache'

      - name: Clear the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*'
